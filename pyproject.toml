[project]
name = "ryoiki"
version = "0.1.0"
description = "Acao top-down de Jujutsu: tecnicas montadas por blocos, Kokusen no timing e choque de dominios."
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
    # a engine ECS compartilhada (repo irmão; em dev: pip install -e ../OuroborosEngine)
    "ouroboros-engine @ git+https://github.com/EzioMilanoX/OuroborosEngine.git",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
